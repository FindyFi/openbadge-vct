name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v5
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the built site
        # The type metadata must be published at the URLs the README gives,
        # and the README's {{placeholders}} must survive the build.
        run: |
          status=0
          for f in index.html credentials/v2/OpenBadgeVCT credentials/student-status/v1/StudentStatusVCT examples/dcql-query.json; do
            [ -e "_site/$f" ] || { echo "::error::_site/$f is missing"; status=1; }
          done
          grep -q '{{achievement_name}}' _site/index.html || { echo "::error::Placeholders were substituted"; status=1; }
          exit $status
      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
