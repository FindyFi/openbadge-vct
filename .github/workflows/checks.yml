name: Checks

on:
  push:
  pull_request:

jobs:
  frozen:
    name: Released versions are unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare each version with its tag
        # A version is frozen once its tag (v1, v2, …) exists: its type
        # metadata and its card template, if it has its own.
        run: |
          status=0
          for tag in $(git tag --list | grep -E '^v[0-9]+$'); do
            paths="credentials/$tag"
            [ -e "templates/svg/OpenBadge_$tag.svg" ] && paths="$paths templates/svg/OpenBadge_$tag.svg"
            if ! git diff --exit-code --stat "$tag" -- $paths; then
              echo "::error::$paths are frozen at tag $tag. Publish changes as a new version instead."
              status=1
            fi
          done
          exit $status

  integrity:
    name: Integrity hashes match the files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/check_integrity.py
