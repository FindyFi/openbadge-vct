name: Checks

on:
  push:
  pull_request:

jobs:
  frozen:
    name: Released versions are unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare each version with its tag
        # A version is frozen once its tag exists: its type metadata and its
        # card template, if it has its own. Open Badge versions are tagged
        # v1, v2, …; Student status versions student-status-v1, ….
        run: |
          status=0
          for tag in $(git tag --list | grep -E '^(student-status-)?v[0-9]+$'); do
            version="${tag##*-}"
            case "$tag" in
              student-status-*) dir="credentials/student-status/$version"; svg="templates/svg/StudentStatus_$version.svg" ;;
              *) dir="credentials/$version"; svg="templates/svg/OpenBadge_$version.svg" ;;
            esac
            paths="$dir"
            [ -e "$svg" ] && paths="$paths $svg"
            if ! git diff --exit-code --stat "$tag" -- $paths; then
              echo "::error::$paths are frozen at tag $tag. Publish changes as a new version instead."
              status=1
            fi
          done
          exit $status

  integrity:
    name: Integrity hashes match the files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/check_integrity.py
